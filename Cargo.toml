[package]
name = "frp-sh"
version = "0.4.0"
edition = "2021"
description = "Social P2P tunnel: room-based UDP hole punching with relay fallback"
license = "MIT"
default-run = "frp-sh"

[features]
default = ["server"]
server = ["dep:axum"]

[dependencies]
frpsh-ui-macros = { path = "crates/ui-macros" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
clap = { version = "4", features = ["derive", "string"] }
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
rand = "0.8"
hex = "0.4"
log = { version = "0.4", features = ["std"] }
bytes = "1"
chacha20poly1305 = "0.10"
sha2 = "0.10"
tun = { version = "0.8", features = ["async"] }
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"
colored = "2"
indicatif = "0.17"
socket2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Services", "Win32_Storage_FileSystem"] }

[dev-dependencies]
env_logger = "0.11"

[profile.release]
strip = true
lto = "thin"
