<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>frp-sh panel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"></script>
<style>
/* frp-sh panel — black canvas / D-DIN display / ghost pill / hairlines only */
@import url('https://fonts.cdnfonts.com/css/d-din');
:root{
  --canvas:#000000; --surface:#0a0a0a; --hair:#3a3a3f;
  --tx:#ffffff; --tx2:#f0f0fa; --tx3:#5a5a5f;
}
*{box-sizing:border-box;margin:0}
html{background:var(--canvas)}
body{font-family:'D-DIN','Arial Narrow',Arial,system-ui,sans-serif;background:var(--canvas);color:var(--tx);font-size:14px;letter-spacing:.32px;-webkit-font-smoothing:antialiased}
::selection{background:var(--tx);color:var(--canvas)}
/* ---- bar (overlay-style nav, hairline only) ---- */
.bar{display:flex;align-items:center;gap:14px;padding:20px 32px;background:var(--canvas);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:9;flex-wrap:wrap}
.wordmark{font-weight:700;font-size:19px;letter-spacing:1.6px;text-transform:uppercase;line-height:.95;flex:none}
.wordmark span{display:block;font-size:10px;font-weight:400;letter-spacing:1.17px;text-transform:uppercase;color:var(--tx3);margin-top:4px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border:1px solid var(--hair);border-radius:32px;font-size:10.5px;font-weight:700;letter-spacing:.96px;text-transform:uppercase;color:var(--tx2)}
.chip b{color:var(--tx);font-weight:700}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--hair);flex:none}
.chip .dot.on{background:var(--tx)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--hair);display:inline-block;flex:none}
.dot.on{background:var(--tx)}
.btn{background:transparent;border:1px solid var(--tx);color:var(--tx);border-radius:32px;padding:8px 22px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1.17px;text-transform:uppercase;cursor:pointer;transition:.15s}
.btn:hover{background:var(--tx);color:var(--canvas)}
/* ---- layout ---- */
.wrap{max-width:1200px;margin:40px auto;padding:0 24px;display:grid;gap:32px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:4px;padding:24px}
.card h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.17px;color:var(--tx2);margin-bottom:20px;display:flex;align-items:center;gap:14px}
.card h2::after{content:"";flex:1;height:1px;background:var(--hair)}
/* ---- stats: hairline grid, no shadow ---- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair)}
.stat{background:var(--canvas);padding:24px}
.stat .n{font-size:40px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.stat .l{font-size:10px;letter-spacing:.96px;text-transform:uppercase;color:var(--tx3);margin-top:12px}
/* ---- rooms ---- */
.room{background:var(--surface);border:1px solid var(--hair);border-radius:4px;cursor:pointer;transition:border-color .15s;display:flex;align-items:center;gap:24px;padding:20px 24px;flex-wrap:wrap;margin-bottom:12px}
.room:last-child{margin-bottom:0}
.room:hover{border-color:var(--tx)}
.rid{font-weight:700;font-size:30px;line-height:.95;font-variant-numeric:tabular-nums;min-width:92px}
.rmeta{color:var(--tx2);font-size:11px;letter-spacing:.96px;text-transform:uppercase;line-height:2}
.rmeta b{color:var(--tx);font-weight:700}
.arrow{margin-left:auto;color:var(--tx3);font-size:20px;transition:.15s}
.room:hover .arrow{color:var(--tx)}
.ttlbar{height:2px;background:var(--hair);overflow:hidden;width:130px;margin-top:6px}
.ttlbar i{display:block;height:100%;background:var(--tx)}
/* ---- detail ---- */
.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 24px;padding:12px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{font-size:10px;font-weight:700;letter-spacing:.96px;text-transform:uppercase;color:var(--tx3);padding-top:3px}
.kv .v{word-break:break-all;color:var(--tx2)}
.kv .v b{color:var(--tx)}
.tnum{font-variant-numeric:tabular-nums;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.96px;text-transform:uppercase;color:var(--tx3);padding:8px 12px 10px;border-bottom:1px solid var(--hair)}
td{padding:12px;border-bottom:1px solid var(--hair);color:var(--tx2)}
td b{color:var(--tx)}
tr:last-child td{border-bottom:0}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--tx2);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1.17px;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.back:hover{color:var(--tx)}
.idle{color:var(--tx3);text-align:center;padding:48px 0;font-size:10.5px;font-weight:700;letter-spacing:.96px;text-transform:uppercase}
.foot{color:var(--tx3);font-size:10px;letter-spacing:.96px;text-transform:uppercase;text-align:center;padding:28px 0 36px}
/* ---- badges / topology ---- */
.kind{display:inline-flex;align-items:center;padding:2px 11px;border:1px solid;border-radius:32px;font-size:9.5px;font-weight:700;letter-spacing:.96px;text-transform:uppercase}
.kind.direct{border-color:var(--tx);color:var(--tx)}
.kind.turn{border-color:var(--tx2);border-style:dashed;color:var(--tx2)}
.kind.relay{border-color:var(--tx3);color:var(--tx3)}
svg .e-direct{stroke:#ffffff;stroke-width:2}
svg .e-turn{stroke:#f0f0fa;stroke-width:2;stroke-dasharray:6 4}
svg .e-relay{stroke:#5a5a5f;stroke-width:2;stroke-dasharray:2 4}
/* ---- gate ---- */
#gate{position:fixed;inset:0;background:var(--canvas);z-index:99;display:none;place-items:center}
#gate .panel{width:min(420px,92vw);text-align:center;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:48px 40px}
#gate .wordmark{font-size:24px;margin-bottom:24px}
#gate h3{font-size:15px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;line-height:1.2;margin-bottom:8px}
#gate p{color:var(--tx3);font-size:11px;letter-spacing:.96px;text-transform:uppercase;margin-bottom:28px}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--hair);border-radius:4px;background:transparent;color:var(--tx);font-family:inherit;font-size:14px;letter-spacing:.32px;outline:none;margin-bottom:12px}
#gate input:focus{border-color:var(--tx)}
#gate .err{font-size:10px;font-weight:700;letter-spacing:.96px;text-transform:uppercase;min-height:14px;margin-bottom:10px}
#gate .btn{width:100%}
@media(max-width:720px){.wrap{padding:0 16px}.kv{grid-template-columns:130px 1fr}.bar{padding:16px 20px}}
</style>
</head>
<body>
<header class="bar">
  <div class="wordmark">frp-sh<span id="bar-sub">signaling server</span></div>
  <span class="spacer"></span>
  <span class="chip" id="chip-auth"><span class="dot"></span><b>—</b></span>
  <span class="chip" id="chip-ver">—</span>
  <button class="btn" id="lang" onclick="toggleLang()">中文</button>
  <button class="btn" id="logs-btn" onclick="toggleLogs()"><span data-i18n="logs">Logs</span></button>
</header>

<main class="wrap">
  <section id="home" style="display:none">
    <div class="stat-row" id="stats"></div>
    <div class="card" style="margin-top:32px">
      <h2 data-i18n="rooms">Rooms</h2>
      <div id="rooms"></div>
    </div>
    <div class="card" style="margin-top:32px">
      <h2 data-i18n="join_t">One-click client join</h2>
      <div style="font-size:11.5px;color:var(--tx3);margin:6px 0 12px;line-height:1.6" data-i18n="join_note"></div>
      <div style="display:flex;align-items:center;gap:10px;margin:0 0 14px">
        <span style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)" data-i18n="room">Room</span>
        <select id="home-join-room" onchange="renderHomeJoin()" style="background:var(--bg1,#111114);color:var(--tx);border:1px solid #26262b;border-radius:8px;padding:6px 10px;font-size:12px"></select>
      </div>
      <div style="margin:10px 0 16px"><div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px" data-i18n="join_win">Windows (PowerShell)</div>
        <pre id="hj-cmd-win" style="background:var(--bg1,#111114);border:1px solid #26262b;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.7;color:var(--tx2);white-space:pre-wrap;word-break:break-all;margin:0 0 8px"></pre>
        <button class="btn" id="hj-copy-win" onclick="copyHomeJoin('win')">Copy</button></div>
      <div style="margin:10px 0 4px"><div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px" data-i18n="join_nix">macOS / Linux (shell)</div>
        <pre id="hj-cmd-nix" style="background:var(--bg1,#111114);border:1px solid #26262b;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.7;color:var(--tx2);white-space:pre-wrap;word-break:break-all;margin:0 0 8px"></pre>
        <button class="btn" id="hj-copy-nix" onclick="copyHomeJoin('nix')">Copy</button></div>
    </div>
  </section>
  <section id="detail" style="display:none"></section>
  <section id="logs-card" class="card" style="display:none;margin-top:32px">
    <h2 style="display:flex;justify-content:space-between;align-items:center"><span data-i18n="logs">Logs</span>
      <span style="font-size:10.5px;color:var(--tx3);letter-spacing:0;text-transform:none" id="log-file"></span></h2>
    <div id="logs" style="max-height:460px;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.75;color:var(--tx2)"></div>
  </section>
</main>

<footer class="foot" id="foot">ws</footer>

<div id="gate">
  <div class="panel">
    <div class="wordmark">frp-sh</div>
    <h3 data-i18n="gate_t">Authentication required</h3>
    <p data-i18n="gate_p">This server is protected by its password.</p>
    <div class="err" id="gate-err"></div>
    <input type="password" id="gate-pw" placeholder="SERVER PASSWORD" autocomplete="off">
    <button class="btn" onclick="saveToken()" data-i18n="gate_go">Enter panel</button>
  </div>
</div>

<script>
const I18N={
en:{rooms:"Rooms",rooms_n:"Rooms",guests:"Guests",relays:"Relay links",turn:"TURN allocs",room:"Room",
host:"Host",guests_n:"guests",ttl:"TTL",lang:"中文",no:"No active rooms",
auth_on:"auth",auth_off:"auth off",auth_ok:"ok",auth_no:"pending",
gate_t:"Authentication required",gate_p:"This server is protected by its password.",
gate_go:"Enter panel",back:"Back to overview",detail:"Room detail",topo:"Topology",
pub:"Public address",lan:"LAN addresses",vnet:"Vnet IP",created:"Created",left:"Time left",
device:"Device",turn_r:"TURN relay",relays_l:"Relay links",proto:"protocol",
status:"Status",up:"Up",down:"Down",online:"online",idle:"idle",
logs:"Logs",logfile:"Log file",nologs:"No logs yet",
join_t:"One-click client join",join_note:"Run this on the client machine (installs frp-sh if missing, saves the profile and joins this room). The password is masked here and only filled in when you copy.",
join_win:"Windows (PowerShell)",join_nix:"macOS / Linux (shell)",
copy:"Copy",copied:"Copied!",
d:"d",h:"h",m:"m"},
zh:{rooms:"房间",rooms_n:"房间数",guests:"访客数",relays:"中继链路",turn:"TURN 分配",room:"房间",
host:"房主",guests_n:"位访客",ttl:"剩余",lang:"EN",no:"暂无活跃房间",
auth_on:"鉴权",auth_off:"鉴权关",auth_ok:"通过",auth_no:"待输入",
gate_t:"需要鉴权",gate_p:"该服务器已启用密码保护。",
gate_go:"进入面板",back:"返回总览",detail:"房间详情",topo:"拓扑",
pub:"公网地址",lan:"局域网地址",vnet:"虚拟 IP",created:"创建于",left:"剩余时间",
device:"设备",turn_r:"TURN 中继",relays_l:"中继链路",proto:"线协议",
status:"状态",up:"上行",down:"下行",online:"在线",idle:"空闲",
logs:"日志",logfile:"日志文件",nologs:"暂无日志",
join_t:"客户端一键接入",join_note:"在客户端机器上运行（自动安装 frp-sh、保存配置并加入本房间）。此处密码打码，复制时才填入真实值。",
join_win:"Windows (PowerShell)",join_nix:"macOS / Linux (shell)",
copy:"复制",copied:"已复制!",
d:"天",h:"时",m:"分"}};
let LANG=localStorage.getItem("frpsh-lang")||"en";
const t=k=>(I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));document.getElementById("lang").textContent=t("lang")}
function toggleLang(){LANG=LANG==="en"?"zh":"en";localStorage.setItem("frpsh-lang",LANG);applyLang();route()}
function esc(s){return String(s??"—").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]))}
function setText(el,v){v=String(v??"");if(el&&el.textContent!==v)el.textContent=v}
function setHTML(el,v){if(el&&el.innerHTML!==v)el.innerHTML=v}
function fmtTtl(s){if(s<=0)return"—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+t("h")+" ":"")+m+t("m")}
function fmtBytes(b){if(b==null)return"—";if(b>=1073741824)return(b/1073741824).toFixed(2)+" GB";if(b>=1048576)return(b/1048576).toFixed(1)+" MB";if(b>=1024)return(b/1024).toFixed(1)+" KB";return Math.round(b)+" B"}
function fmtBps(b){if(b==null)return"";if(b>=1048576)return(b/1048576).toFixed(1)+" MB/S";if(b>=1024)return(b/1024).toFixed(1)+" KB/S";return Math.round(b)+" B/S"}
/* GSAP（CDN 不可用时静默降级为无动画） */
const G=window.gsap||null;
function animIn(els,stagger){if(!G||!els.length)return;G.from(els,{opacity:0,y:10,duration:.35,ease:"power2.out",stagger:stagger||.05,clearProps:"all"})}
function flash(el){if(!G||!el)return;G.fromTo(el,{opacity:.25},{opacity:1,duration:.4,ease:"power1.out"})}

/* ---- auth ---- */
let TOKEN=sessionStorage.getItem("frpsh-token")||"";
function tokenQs(){return TOKEN?("?token="+encodeURIComponent(TOKEN)):""}
function showGate(msg){document.getElementById("gate").style.display="grid";document.getElementById("gate-err").textContent=msg||""}
function hideGate(){document.getElementById("gate").style.display="none"}
function saveToken(){TOKEN=document.getElementById("gate-pw").value.trim();
if(!TOKEN){document.getElementById("gate-err").textContent="PASSWORD REQUIRED";return}
sessionStorage.setItem("frpsh-token",TOKEN);connect()}
document.getElementById("gate-pw").addEventListener("keydown",e=>{if(e.key==="Enter")saveToken()});

/* ---- data ---- */
let lastSummary=null,lastRooms=null,lastRoomsKey="",prevStats={};
async function fetchJson(url){
  const r=await fetch(url+tokenQs());
  if(r.status===401){showGate(t("gate_p"));throw new Error("unauthorized")}
  return r.json();
}
function renderAuth(){
  const c=document.getElementById("chip-auth");
  if(!lastSummary)return;
  if(lastSummary.auth){
    c.innerHTML='<span class="dot'+(TOKEN?" on":"")+'"></span><b>'+esc(t("auth_on")+" · "+(TOKEN?t("auth_ok"):t("auth_no")))+"</b>";
  }else{
    c.innerHTML='<span class="dot"></span><b>'+esc(t("auth_off"))+"</b>";
  }
  document.getElementById("chip-ver").textContent=(lastSummary.version||"—")+" · "+t("proto")+" V"+(lastSummary.protocol||"—");
}
function statCard(n,l,key){return '<div class="stat"><div class="n" data-k="'+key+'">'+(n??0)+'</div><div class="l">'+esc(l)+"</div></div>"}
function renderHome(){
  const s=lastSummary||{};
  document.getElementById("stats").innerHTML=
    statCard(s.rooms,t("rooms_n"),"rooms")+statCard(s.guests,t("guests"),"guests")+
    statCard(s.relay_links,t("relays"),"relays")+statCard(s.turn_allocs,t("turn"),"turn");
  ["rooms","guests","relays","turn"].forEach(k=>{
    if(prevStats[k]!==undefined&&prevStats[k]!==(s[k]??0)){
      const el=document.querySelector('.stat .n[data-k="'+k+'"]');flash(el);
    }
    prevStats[k]=s[k]??0;
  });
  const rooms=lastRooms||[];
  const key=rooms.map(r=>r.room_id+":"+((r.guests||[]).length)).join(",");
  const rc=document.getElementById("rooms");
  if(!rooms.length){rc.innerHTML='<div class="idle">'+esc(t("no"))+"</div>";return}
  rc.innerHTML=rooms.map(r=>{
    const g=(r.guests||[]).length;
    const ttlFrac=Math.max(0,Math.min(1,(r.ttl_left_s||0)/43200));
    return '<div class="room" onclick="openRoom(\''+esc(r.room_id)+'\')">'
      +'<div class="rid">'+esc(r.room_id)+"</div>"
      +'<div class="rmeta"><b>'+esc((r.host&&r.host.name)||t("host"))+'</b> · V'+esc(r.host&&r.host.version)+"<br>"
      +g+" "+esc(t("guests_n"))+" · "+esc(r.host&&r.host.addr)+"</div>"
      +'<div><div class="rmeta" style="margin-bottom:2px">'+esc(t("ttl"))+" "+esc(fmtTtl(r.ttl_left_s))+'</div><div class="ttlbar"><i style="width:'+Math.round(ttlFrac*100)+'%"></i></div></div>'
      +'<span class="qrbtns" style="display:flex;gap:6px;align-items:center">'
      +'<button class="btn" style="padding:6px 12px;font-size:11.5px" title="'+esc(t("join_win"))+'" onclick="copyHomeCmd(event,\''+esc(r.room_id)+'\',\'win\')">⧉ Windows</button>'
      +'<button class="btn" style="padding:6px 12px;font-size:11.5px" title="'+esc(t("join_nix"))+'" onclick="copyHomeCmd(event,\''+esc(r.room_id)+'\',\'nix\')">⧉ Mac / Linux</button>'
      +"</span>"
      +'<span class="arrow">→</span></div>';
  }).join("");
  if(key!==lastRoomsKey){lastRoomsKey=key;animIn(rc.querySelectorAll(".room"),.06)}
  renderHomeJoin();
}
/* 首页底部"一键配置客户端"：房间下拉 + 命令（密码遮罩，复制落明文） */
function renderHomeJoin(){
  const sel=document.getElementById("home-join-room");
  if(!sel)return;
  const rooms=lastRooms||[];
  const prev=sel.value;
  sel.innerHTML=rooms.map(r=>'<option value="'+esc(r.room_id)+'"'+(r.room_id===prev?" selected":"")+">"+esc(r.room_id)+"</option>").join("");
  const rid=sel.value||(rooms[0]&&rooms[0].room_id)||"";
  if(!rid){setText(document.getElementById("hj-cmd-win"),t("no"));setText(document.getElementById("hj-cmd-nix"),"");return}
  setText(document.getElementById("hj-cmd-win"),joinCmd(rid,"win").shown);
  setText(document.getElementById("hj-cmd-nix"),joinCmd(rid,"nix").shown);
  window._hjRoom=rid;
}
async function copyHomeJoin(platform){
  const rid=window._hjRoom||(document.getElementById("home-join-room")||{}).value;
  if(!rid)return;
  const c=joinCmd(rid,platform).real;
  try{await navigator.clipboard.writeText(c)}
  catch(e){
    const ta=document.createElement("textarea");ta.value=c;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");ta.remove();
  }
  const b=document.getElementById("hj-copy-"+platform);
  if(b){const old=b.textContent;b.textContent=t("copied");setTimeout(()=>{b.textContent=t("copy")},1500)}
}
function openRoom(id){location.hash="#/room/"+id;route()}
function goHome(){location.hash="";route()}
/* 首页房间行内复制一键接入命令（不进详情页；密码走 TOKEN，profile 服务端去重） */
async function copyHomeCmd(ev,roomId,platform){
  ev.stopPropagation();
  const c=joinCmd(roomId,platform).real;
  try{await navigator.clipboard.writeText(c)}
  catch(e){
    const ta=document.createElement("textarea");ta.value=c;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");ta.remove();
  }
  const b=ev.target||ev.srcElement;const old=b.textContent;b.textContent="✓";
  setTimeout(()=>{b.textContent=old},1200);
}
function route(){
  const m=location.hash.match(/^#\/room\/(.+)$/);
  const isDetail=!!m&&!!(lastRooms||[]).find(r=>r.room_id===m[1]);
  document.getElementById("home").style.display=isDetail?"none":"block";
  document.getElementById("detail").style.display=isDetail?"block":"none";
  if(isDetail)renderDetail(m[1]);else renderHome();
}
function topoSvg(room){
  const cx=280,cy=150,rx=210,ry=95;
  const host=room.host||{},guests=room.guests||[];
  const relays=room.relay_pairs||0;
  let s='<svg viewBox="0 0 560 300" width="100%" height="300">';
  guests.forEach((g,i)=>{
    const ang=-Math.PI/2+i*2*Math.PI/Math.max(guests.length,1);
    const x=cx+rx*Math.cos(ang),y=cy+ry*Math.sin(ang);
    const kind=g.turn_relay?"turn":(relays>0?"relay":"direct");
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" class="e-'+kind+'"/>';
  });
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="34" fill="#ffffff"/>'
    +'<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="11" fill="#000000" font-weight="700" letter-spacing="1">'+esc((host.name||"host").slice(0,10).toUpperCase())+'</text>'
    +'<text x="'+cx+'" y="'+(cy+13)+'" text-anchor="middle" font-size="9" fill="#5a5a5f">'+esc(host.vnet_ip||room.room_id)+'</text>';
  guests.forEach((g,i)=>{
    const ang=-Math.PI/2+i*2*Math.PI/Math.max(guests.length,1);
    const x=cx+rx*Math.cos(ang),y=cy+ry*Math.sin(ang);
    s+='<circle cx="'+x+'" cy="'+y+'" r="30" fill="#0a0a0a" stroke="#3a3a3f" stroke-width="1.5"/>'
      +'<text x="'+x+'" y="'+(y-2)+'" text-anchor="middle" font-size="10.5" fill="#ffffff" font-weight="700" letter-spacing="0.5">'+esc((g.name||g.uuid||"?").slice(0,10).toUpperCase())+'</text>'
      +'<text x="'+x+'" y="'+(y+12)+'" text-anchor="middle" font-size="9" fill="#5a5a5f">'+esc(g.vnet_ip||"")+'</text>';
  });
  return s+"</svg>";
}
/* ---------- 一键接入：生成客户端 profile 配置命令（密码遮罩，复制才落明文） ---------- */
function joinCmdBlock(roomId,platform,label){
  const c=joinCmd(roomId,platform);
  return '<div style="margin:10px 0 16px"><div style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px">'+esc(label)+'</div>'
    +'<pre id="cmd-'+platform+'" style="background:var(--bg1,#111114);border:1px solid #26262b;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.7;color:var(--tx2);white-space:pre-wrap;word-break:break-all;margin:0 0 8px">'+esc(c.shown)+'</pre>'
    +'<button class="btn" id="copy-'+platform+'" onclick="copyJoinCmd(\''+esc(roomId)+'\',\''+platform+'\')">'+esc(t("copy"))+"</button></div>";
}
function joinCmd(roomId, platform){
  const origin=location.origin;
  const relay=location.hostname+":8081";
  const pw=TOKEN||"";
  const shown=pw?(pw.slice(0,2)+"••••••"+pw.slice(-2)):"<server-password>";
  const real=pw||"<server-password>";
  const winCmd=p=>`$env:FRPSH_SKIP_INIT='1'; irm https://frp.sh/install.ps1 | iex; $env:Path += ";$env:LOCALAPPDATA\\frp-sh"; frp-sh profile add --server ${origin} --relay ${relay} --room ${roomId} --password ${p} --mode lan --set-default; frp-sh profile run`;
  const nixCmd=p=>`curl -fsSL https://frp.sh/install.sh | FRPSH_SKIP_INIT=1 sh && frp-sh profile add --server ${origin} --relay ${relay} --room ${roomId} --password ${p} --mode lan --set-default && frp-sh profile run`;
  if(platform==="win")return{shown:winCmd(shown),real:winCmd(real)};
  return{shown:nixCmd(shown),real:nixCmd(real)};
}
async function copyJoinCmd(roomId,platform){
  const c=joinCmd(roomId,platform).real;
  try{await navigator.clipboard.writeText(c)}
  catch(e){
    const ta=document.createElement("textarea");ta.value=c;document.body.appendChild(ta);
    ta.select();document.execCommand("copy");ta.remove();
  }
  flashCopied(platform);
}
function flashCopied(platform){
  const b=document.getElementById("copy-"+platform);
  if(!b)return;const old=b.textContent;b.textContent=t("copied");
  setTimeout(()=>{b.textContent=old},1500);
}
/* 拓扑入场：连线按长度描画（虚线样式动画后还原），节点半径弹入 */function animTopo(svgEl){
  if(!G||!svgEl)return;
  svgEl.querySelectorAll("line").forEach((ln,i)=>{
    let len=300;try{len=ln.getTotalLength()}catch(e){}
    const dashed=ln.classList.contains("e-turn")||ln.classList.contains("e-relay");
    if(!dashed){
      ln.style.strokeDasharray=len;ln.style.strokeDashoffset=len;
      G.to(ln,{strokeDashoffset:0,duration:.6,ease:"power2.inOut",delay:.1+i*.08,
        onComplete:()=>{ln.style.strokeDasharray="";ln.style.strokeDashoffset=""}});
    }else{
      G.from(ln,{opacity:0,duration:.5,delay:.1+i*.08});
    }
  });
  G.from(svgEl.querySelectorAll("circle"),{attr:{r:0},opacity:0,duration:.4,ease:"power2.out",stagger:.06,delay:.15,clearProps:"all"});
  G.from(svgEl.querySelectorAll("text"),{opacity:0,duration:.4,delay:.35,clearProps:"all"});
}
/* 房间详情：设备连接表（状态 / 上下行含实时速率），房主行置顶 */
let prevDetail={room:null,ts:0,rows:{},host:null};
let prevDetailChanged=null;
function detailStatus(g,relays){
  const kind=g.turn_relay?"turn":((relays>0)?"relay":"direct");
  const live=g.t_ts&&(Date.now()/1000-g.t_ts)<10;
  return {kind,live:!!live};
}
function trafficCell(cur,prev,dt){
  if(cur==null)return '<span style="color:var(--tx3)">—</span>';
  const rate=dt>0&&prev!=null?Math.max(0,cur-prev)/dt:null;
  return fmtBytes(cur)+(rate!=null?' <span style="color:var(--tx3);font-size:10.5px">'+fmtBps(rate)+"</span>":"");
}
function renderDetail(id){
  const room=(lastRooms||[]).find(r=>r.room_id===id);
  if(!room){route();return}
  const host=room.host||{};const guests=room.guests||[];
  const now=Date.now();
  const dt=prevDetail.room===id&&prevDetail.ts?(now-prevDetail.ts)/1000:0;
  const rowPrev=prevDetail.room===id?prevDetail.rows:{};
  const hostPrev=prevDetail.room===id?prevDetail.host:null;
  const kv=(k,v)=>'<div class="kv"><span class="k">'+esc(k)+'</span><span class="v">'+v+"</span></div>";
  const d=document.getElementById("detail");
  const statusCell=(g,relays)=>{
    const st=detailStatus(g,relays);
    return '<span class="dot'+(st.live?" on":"")+'" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>'
      +'<span class="kind '+st.kind+'">'+esc(t(st.kind))+"</span>";
  };
  let table='<table><tr><th>'+esc(t("device"))+'</th><th>'+esc(t("status"))+'</th><th>'+esc(t("pub"))+'</th><th>'+esc(t("lan"))+'</th><th>'+esc(t("vnet"))+'</th><th>↑ '+esc(t("up"))+'</th><th>↓ '+esc(t("down"))+"</th></tr>";
  const relays=room.relay_pairs||0;
  table+='<tr><td><b>'+esc(host.name||t("host"))+"</b></td>"
    +"<td>"+statusCell(host,relays)+"</td>"
    +'<td class="tnum">'+esc(host.addr)+"</td>"
    +'<td class="tnum">'+esc((host.lan||[]).join(", ")||"—")+"</td>"
    +'<td class="tnum">'+esc(host.vnet_ip||"—")+"</td>"
    +'<td class="tnum">'+trafficCell(host.up==null?null:host.up,hostPrev?hostPrev.up:null,dt)+"</td>"
    +'<td class="tnum">'+trafficCell(host.down==null?null:host.down,hostPrev?hostPrev.down:null,dt)+"</td></tr>";
  guests.forEach(g=>{
    const p=rowPrev[g.uuid]||null;
    table+='<tr><td><b>'+esc(g.name||g.uuid)+"</b></td>"
      +"<td>"+statusCell(g,relays)+"</td>"
      +'<td class="tnum">'+esc(g.addr)+"</td>"
      +'<td class="tnum">'+esc((g.lan||[]).join(", ")||"—")+"</td>"
      +'<td class="tnum">'+esc(g.vnet_ip||"—")+"</td>"
      +'<td class="tnum">'+trafficCell(g.up,p?p.up:null,dt)+"</td>"
      +'<td class="tnum">'+trafficCell(g.down,p?p.down:null,dt)+"</td></tr>";
  });
  table+="</table>";
  d.innerHTML=
    '<span class="back" onclick="goHome()">← '+esc(t("back"))+"</span>"
    +'<div class="card" style="margin-top:16px"><h2>'+esc(t("detail"))+' — '+esc(room.room_id)+"</h2>"
    +'<div class="kv"><span class="k">'+esc(t("host"))+'</span><span class="v"><b>'+esc(host.name||"—")+'</b> <span class="tnum">('+esc(host.addr)+")</span> · V"+esc(host.version)+"</span></div>"
    +kv(t("vnet"),'<span class="tnum">'+esc(host.vnet_ip||"—")+"</span>")
    +kv(t("lan"),'<span class="tnum">'+esc((host.lan||[]).join(", ")||"—")+"</span>")
    +kv(t("created"),'<span class="tnum">'+new Date((room.created_at||0)*1000).toLocaleString()+"</span>")
    +kv(t("left"),esc(fmtTtl(room.ttl_left_s))+" · "+esc(t("relays_l"))+": "+(room.relay_pairs||0))+"</div>"
    +'<div class="card"><h2>'+esc(t("topo"))+"</h2>"+topoSvg(room)+"</div>"
    +'<div class="card"><h2>'+esc(t("guests"))+"</h2>"
    +(guests.length?table:'<div class="idle">'+esc(t("no"))+"</div>")+"</div>"
    +'<div class="card"><h2>'+esc(t("join_t"))+'</h2><div style="font-size:11.5px;color:var(--tx3);margin:6px 0 12px;line-height:1.6">'+esc(t("join_note"))+"</div>"
    +joinCmdBlock(room.room_id,"win",t("join_win"))
    +joinCmdBlock(room.room_id,"nix",t("join_nix"))+"</div>";
  // 速率基准 + 动画（仅在切换房间时播放入场）
  const rows={};guests.forEach(g=>{rows[g.uuid]={up:g.up,down:g.down}});
  prevDetail={room:id,ts:now,rows,host:{up:host.up,down:host.down}};
  const svgEl=d.querySelector("svg");
  if(prevDetailChanged!==id){
    prevDetailChanged=id;
    animTopo(svgEl);
    animIn(d.querySelectorAll(".card"),.07);
  }
}
/* ---- ws ---- */
let ws=null;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host+"/api/panel/ws"+tokenQs());
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    lastSummary=d.summary;lastRooms=d.rooms;
    hideGate();renderAuth();route();
  };
  ws.onclose=()=>{document.getElementById("foot").textContent="ws reconnecting …";setTimeout(connect,2500)};
  ws.onopen=()=>{document.getElementById("foot").textContent="ws · 2s"};
}
/* ---------- 日志视图（/api/panel/debug，2s 增量拉取，只 append 新行） ---------- */
let logsTimer=null,logSeq=0;
function logTime(ts){const d=new Date(ts*1000);const p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())}
async function pullLogs(){
  try{
    const d=await fetchJson("/api/panel/debug");
    const lc=document.getElementById("logs");
    setText(document.getElementById("log-file"),d.file?d.file:t("logfile"));
    if(d.total<logSeq){lc.innerHTML="";logSeq=0} // 服务器重启 → 重置
    const skip=logSeq-Math.max(0,(d.total-d.lines.length));
    d.lines.slice(Math.max(skip,0)).forEach(l=>{
      if(l.seq<=logSeq)return;
      const row=document.createElement("div");
      const c=l.level==="WARN"?"#e8c66a":(l.level==="ERROR"?"#e86a6a":(l.level==="DEBUG"?"#5a5a5f":"var(--tx2)"));
      row.innerHTML='<span style="color:var(--tx3)">'+logTime(l.ts)+'</span> <span style="color:'+c+';display:inline-block;min-width:46px">'+esc(l.level)+'</span> <span style="color:'+c+'">'+esc(l.msg)+"</span>";
      lc.appendChild(row);
      logSeq=l.seq;
    });
    while(lc.children.length>1000)lc.removeChild(lc.firstChild);
    lc.scrollTop=lc.scrollHeight;
  }catch(e){}
}
function toggleLogs(){
  const c=document.getElementById("logs-card");
  const on=c.style.display!=="block";
  c.style.display=on?"block":"none";
  document.getElementById("logs-btn").style.outline=on?"1px solid var(--tx)":"";
  if(on&&!logsTimer){pullLogs();logsTimer=setInterval(pullLogs,2000)}
  if(!on&&logsTimer){clearInterval(logsTimer);logsTimer=null}
}
applyLang();
if(G){G.from(".bar > *",{opacity:0,y:-8,duration:.4,ease:"power2.out",stagger:.06,clearProps:"all"})}
fetchJson("/api/panel/summary").then(s=>{lastSummary=s;renderAuth();hideGate();connect();}).catch(()=>{});
</script>
