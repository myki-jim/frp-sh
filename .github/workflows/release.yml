name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: frp-sh-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: frp-sh-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: frp-sh-windows-x86_64.exe
          # Intel macOS: 用 zigbuild 在 Linux runner 上交叉编译
          # （macos-13 公共 runner 排队严重，纯 Rust 项目无需 SDK 即可链接）
          - os: ubuntu-latest
            target: x86_64-apple-darwin
            asset: frp-sh-macos-x86_64
            zigbuild: true
          - os: macos-14
            target: aarch64-apple-darwin
            asset: frp-sh-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig (cross-compile)
        if: matrix.zigbuild
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build release
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv frp-sh.exe "${{ matrix.asset }}" 2>/dev/null || mv frp-sh "${{ matrix.asset }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset }}
