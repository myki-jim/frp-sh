name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: frp-sh-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: frp-sh-linux-aarch64
          # musl 静态构建：OpenWrt / Alpine 等 musl libc 系统（无 glibc 依赖）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: frp-sh-linux-x86_64-musl
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: frp-sh-linux-aarch64-musl
            zigbuild: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: frp-sh-windows-x86_64.exe
          # Intel macOS: 用 zigbuild 在 Linux runner 上交叉编译
          # （macos-13 公共 runner 排队严重，纯 Rust 项目无需 SDK 即可链接）
          - os: ubuntu-latest
            target: x86_64-apple-darwin
            asset: frp-sh-macos-x86_64
            zigbuild: true
          - os: macos-14
            target: aarch64-apple-darwin
            asset: frp-sh-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig (cross-compile)
        if: matrix.zigbuild
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build release
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --target ${{ matrix.target }}

      # Apple Silicon 要求二进制至少为 ad-hoc 签名，否则会被系统直接杀掉
      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - target/${{ matrix.target }}/release/frp-sh

      - name: Rename artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv frp-sh.exe "${{ matrix.asset }}" 2>/dev/null || mv frp-sh "${{ matrix.asset }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset }}

      - name: Upload artifact for site sync
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset }}

  sync-downloads:
    name: Sync site downloads
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .artifacts
          merge-multiple: true

      - name: Update site downloads
        run: |
          mkdir -p web/docs/public/downloads
          cp .artifacts/* web/docs/public/downloads/
          ls -la web/docs/public/downloads/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/docs/public/downloads/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync release binaries to site downloads"
            # tag 触发的 checkout 处于 detached HEAD；先 rebase 到最新 main，
            # 避免与并发推送（文档/其他提交）冲突导致 non-fast-forward
            git fetch origin main
            git rebase origin/main || { git checkout --theirs web/docs/public/downloads/; git add web/docs/public/downloads/; git rebase --continue || true; }
            git push origin HEAD:main
          fi

      # GITHUB_TOKEN 推送的提交不会触发 pages.yml（防循环规则），
      # 因此这里直接构建并部署文档站，保证二进制立即可用。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: web

      - name: Build docs site
        run: npm run build
        working-directory: web

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # tag 触发的 checkout 处于 detached HEAD，wrangler 会误判分支为 v0.1.4
        # 并部署到 preview —— 必须显式 --branch main 强制部署到生产
        run: npx --yes wrangler@latest pages deploy web/docs/.vitepress/dist --project-name=frp-sh --branch main
