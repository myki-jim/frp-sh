name: CI

on:
  push:
    branches: [main, codex/0.4.0-overhaul]
  pull_request:

jobs:
  rust:
    name: Rust build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Security regressions (no retry)
        run: cargo test --locked --test security_regressions -- --test-threads=1

      - name: Client-only check
        run: cargo check --locked --no-default-features --all-targets

      - name: Test
        run: cargo test --locked -- --test-threads=1

      - name: Build helper and client
        run: cargo build --locked --bins

      - name: Windows ordinary-user helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-helper-windows.ps1

      - name: macOS ordinary-user helper
        if: runner.os == 'macOS'
        run: sh scripts/test-helper-macos.sh

      - name: Linux isolated ordinary-user helper
        if: runner.os == 'Linux'
        run: |
          docker run --rm --cap-add NET_ADMIN --device /dev/net/tun -e FRPSH_CONTAINER_TEST=1 -v "$PWD:/work" -w /work rust:1-slim sh -c "apt-get update -qq && apt-get install -y -qq iproute2 procps >/dev/null && cargo test --locked --test helper_service helper_service_lifecycle -- --ignored --nocapture"

      - name: Release build
        run: cargo build --locked --release --bins

  docs:
    name: Docs build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: web

      - name: Build docs site
        run: npm run build
        working-directory: web

      - name: Verify POSIX scripts syntax
        run: |
          sh -n web/docs/public/install.sh
          sh -n scripts/test-helper-macos.sh

      - name: Verify PowerShell scripts syntax
        shell: pwsh
        run: |
          foreach ($path in @('web/docs/public/install.ps1','scripts/test-helper-windows.ps1')) {
            $errors = $null
            $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
